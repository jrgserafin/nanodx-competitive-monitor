name: Competitive monitor

on:
  schedule:
    # 11:00 UTC = 7:00 ET in summer (EDT), 6:00 ET in winter (EST). Mon–Fri.
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      only:
        description: "Only these competitors (name contains, blank = all)"
        required: false
        default: ""
      send_email:
        description: "Email the digest"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["dashboard.html", "competitors.yaml", "monitor.py", ".github/workflows/monitor.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: competitive-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check script parses
        run: python -m py_compile monitor.py

      - name: Collect and build digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email == true }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then python monitor.py run --only "$ONLY"; else python monitor.py run; fi

      - name: Save data to repo
        run: |
          git config user.name "competitive-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Monitor run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "Push failed, retrying ($i)"; sleep 10
          done
          exit 1

      - name: Build dashboard
        run: python monitor.py build-site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
