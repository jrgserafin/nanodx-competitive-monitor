name: Competitive monitor

on:
  schedule:
    # Morning run, Mon–Fri 11:00 UTC (7:00 ET summer / 6:00 ET winter):
    # collect + alerts + daily digest (+ weekly review on Mondays)
    - cron: "0 11 * * 1-5"
    # Daytime alert sweeps, Mon–Fri ~11:00, 15:00 and 19:00 ET (summer)
    - cron: "0 15,19,23 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [digest, alerts, weekly, collect]
        default: digest
      only:
        description: "Only these competitors (name contains, blank = all)"
        required: false
        default: ""
      send_email:
        description: "Send email"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["dashboard.html", "competitors.yaml", "monitor.py", ".github/workflows/monitor.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: competitive-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
      ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PATENTSVIEW_API_KEY: ${{ secrets.PATENTSVIEW_API_KEY }}
      SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
      COMPANY_CONTEXT: ${{ secrets.COMPANY_CONTEXT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check script parses
        run: python -m py_compile monitor.py

      - name: Decide what to run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_MODE: ${{ inputs.mode }}
          IN_SEND: ${{ inputs.send_email }}
        run: |
          MODE=collect; SEND=false; WEEKLY=false
          if [ "$EVENT" = "schedule" ]; then
            SEND=true
            if [ "$SCHEDULE" = "0 11 * * 1-5" ]; then
              MODE=digest
              if [ "$(date -u +%u)" = "1" ]; then WEEKLY=true; fi
            else
              MODE=alerts
            fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            MODE="$IN_MODE"; SEND="$IN_SEND"
            if [ "$MODE" = "weekly" ]; then WEEKLY=true; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "send=$SEND" >> "$GITHUB_OUTPUT"
          echo "weekly=$WEEKLY" >> "$GITHUB_OUTPUT"
          echo "Plan: mode=$MODE send=$SEND weekly=$WEEKLY"

      - name: Collect
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then python monitor.py collect --only "$ONLY"; else python monitor.py collect; fi

      - name: Alerts
        if: steps.plan.outputs.mode == 'alerts' || steps.plan.outputs.mode == 'digest'
        env:
          SEND_EMAIL: ${{ steps.plan.outputs.send }}
        run: python monitor.py alerts

      - name: Daily digest
        if: steps.plan.outputs.mode == 'digest'
        env:
          SEND_EMAIL: ${{ steps.plan.outputs.send }}
        run: python monitor.py digest

      - name: Weekly review + battlecards
        if: steps.plan.outputs.weekly == 'true'
        env:
          SEND_EMAIL: ${{ steps.plan.outputs.send }}
        run: python monitor.py weekly

      - name: Save data to repo
        run: |
          git config user.name "competitive-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Monitor ${{ steps.plan.outputs.mode }} run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "Push failed, retrying ($i)"; sleep 10
          done
          exit 1

      - name: Build dashboard
        run: python monitor.py build-site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: monitor
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
