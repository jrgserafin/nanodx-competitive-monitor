# NanoDx Competitive Monitor — what to watch
#
# Edit this file on GitHub (pencil icon) to add/remove competitors. Changes take
# effect on the next run. Every field except `name` is optional.
#
#   name            Display name
#   category        Free-text grouping shown on the dashboard
#   website         Homepage (linked from the dashboard)
#   watch_pages     Pages to scrape for NEW headlines/links (newsroom, press, products)
#   news_queries    Google News searches (use quotes for exact phrases)
#   rss             Any RSS/Atom feed URLs (investor relations, blogs)
#   fda_applicant   Company name as it appears in FDA 510(k)/PMA records
#   trials_sponsor  Sponsor name on ClinicalTrials.gov
#   pubmed_query    PubMed search for new publications
#   relevance_keywords  For big companies: FDA, trial, website, RSS, patent and job
#                   items are kept only if they mention one of these words (news,
#                   PubMed and SEC are already targeted, so they are not filtered)
#   sec_ticker      US stock ticker -> SEC EDGAR filings (8-K, 10-Q, 10-K, S-1 ...)
#   patent_assignee Company name on US patents (needs PATENTSVIEW_API_KEY secret)
#   jobs            Public job board -> hiring signals, e.g. {greenhouse: companyslug},
#                   {lever: companyslug} or {ashby: companyslug}
#   federal_register_query  Search of CMS/FDA rules & notices (best on a topic)
#   profile         Battlecard notes your team maintains: hq, ticker, products,
#                   pricing, positioning, notes. The AI battlecard reads these.
#
# STARTER LIST — replace with George's list.

settings:
  digest_title: "NanoDx Competitive Digest"
  # THIS REPO IS PUBLIC. Keep confidential details out of this file.
  # The AI analyst (ANTHROPIC_API_KEY secret) reads NanoDx's description from the
  # COMPANY_CONTEXT secret (preferred: private) or, if that's missing, from here.
  company_context: >-
    NanoDx develops diagnostics for traumatic brain injury (TBI).
  # false = AI briefs and battlecard strategy (threat level, strengths, weaknesses,
  # talk track) are emailed only and never written to this public repo/site.
  publish_strategy: false
  ai_model: claude-sonnet-4-5   # any current Claude model id
  # Items mentioning these trigger an instant alert email (FDA decisions and
  # material SEC 8-Ks always alert).
  alert_keywords: [FDA clearance, FDA cleared, clears, 510(k), De Novo, PMA, approval, approved, Breakthrough Device, CE mark, CLIA waiver, waived, acquisition, acquire, acquires, merger, recall, launch, launches, reimbursement, CPT code]
  lookback_days: 14          # ignore items published longer ago than this
  send_when_empty: true      # still email a short "no new activity" note
  max_items_per_source: 15
  # Words that mark an item as "high signal" (case-insensitive)
  signal_keywords:
    - FDA
    - 510(k)
    - clearance
    - approval
    - CE mark
    - CLIA
    - waived
    - launch
    - acquisition
    - acquire
    - partnership
    - reimbursement
    - CPT
    - recall
    - whole blood
    - point-of-care
    - GFAP
    - UCH-L1
    - concussion
    - layoffs
    - funding
    - raises

competitors:
  - name: Abbott
    category: TBI blood test
    website: https://www.abbott.com
    watch_pages:
      - https://abbott.mediaroom.com/press-releases
    news_queries:
      - '"Abbott" "TBI" test'
      - '"i-STAT TBI"'
      - '"Alinity" TBI'
    fda_applicant: "Abbott"
    trials_sponsor: "Abbott"
    pubmed_query: '"i-STAT TBI" OR "i-STAT Alinity" AND (GFAP OR "UCH-L1")'
    relevance_keywords: [brain injury, TBI, concussion, GFAP, UCH-L1, head injury, traumatic]
    sec_ticker: ABT
    patent_assignee: Abbott
    profile:
      ticker: ABT (NYSE)
      products: [i-STAT TBI, Alinity i TBI]
      notes: ""   # public! keep to non-confidential facts

  - name: bioMérieux
    category: TBI blood test
    website: https://www.biomerieux.com
    news_queries:
      - '"bioMerieux" "VIDAS TBI"'
      - '"bioMerieux" traumatic brain injury'
    fda_applicant: "bioMerieux"
    trials_sponsor: "bioMérieux"
    pubmed_query: '"VIDAS TBI"'
    relevance_keywords: [brain injury, TBI, concussion, GFAP, UCH-L1, head injury, traumatic]
    patent_assignee: bioMerieux
    profile:
      ticker: BIM (Euronext Paris)
      products: [VIDAS TBI (GFAP, UCH-L1)]
      notes: ""

  - name: Roche
    category: TBI blood test
    website: https://diagnostics.roche.com
    news_queries:
      - '"Roche" "Elecsys" (GFAP OR "UCH-L1" OR "brain injury")'
      - '"Roche Diagnostics" concussion'
    fda_applicant: "Roche"
    pubmed_query: 'Elecsys AND (GFAP OR "UCH-L1")'
    relevance_keywords: [brain injury, TBI, concussion, GFAP, UCH-L1, head injury, traumatic]
    patent_assignee: Roche
    profile:
      ticker: ROG (SIX Swiss Exchange)
      products: [Elecsys immunoassays (GFAP / UCH-L1)]
      notes: ""

  - name: Quanterix
    category: Biomarker platform
    website: https://www.quanterix.com
    news_queries:
      - '"Quanterix"'
    fda_applicant: "Quanterix"
    trials_sponsor: "Quanterix"
    pubmed_query: 'Simoa AND ("traumatic brain injury" OR concussion)'
    sec_ticker: QTRX
    patent_assignee: Quanterix
    # jobs: {greenhouse: quanterix}   # uncomment if they use a public Greenhouse/Lever/Ashby board
    profile:
      ticker: QTRX (Nasdaq)
      products: [Simoa platform (HD-X, SR-X, SP-X)]
      notes: ""

  - name: BrainScope
    category: TBI device
    website: https://www.brainscope.com
    news_queries:
      - '"BrainScope"'
    fda_applicant: "BrainScope"
    trials_sponsor: "BrainScope"
    patent_assignee: BrainScope
    profile:
      ticker: private
      products: [Ahead (EEG-based brain function assessment)]
      notes: ""

# Market-level topics (not tied to one company)
topics:
  - name: TBI diagnostics market
    news_queries:
      - '"traumatic brain injury" blood test'
      - 'concussion blood test FDA'
    pubmed_query: '("traumatic brain injury" OR concussion) AND (GFAP OR "UCH-L1") AND "point-of-care"'
    # CMS payment rules, FDA notices and guidance in the Federal Register
    federal_register_query: 'traumatic brain injury'

  - name: Lab reimbursement (CMS)
    category: Market topic
    federal_register_query: '"clinical laboratory fee schedule" OR "Medicare Physician Fee Schedule" OR "proprietary laboratory analyses"'
    news_queries:
      - 'CMS "clinical laboratory fee schedule"'
