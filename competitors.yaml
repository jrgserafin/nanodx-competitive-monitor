  relevance_keywords: [brain, concussion, traumatic, TBI, GFAP, UCH-L1, head injury, intracranial, neuro]
  news_queries:
  - '"traumatic brain injury" blood test'
  - concussion blood test FDA
  pubmed_query: ("traumatic brain injury" OR concussion) AND (GFAP OR "UCH-L1") AND "point-of-care"
  federal_register_query: traumatic brain injury
- name: Lab reimbursement (CMS)
  category: Market topic
  federal_register_query: '"clinical laboratory fee schedule" OR "Medicare Physician Fee Schedule" OR "proprietary laboratory analyses"'
  news_queries:
  - CMS "clinical laboratory fee schedule"

# ---- Research topics from the NanoDx TBI Master Research Workbook (Keyword Library, Oct 2026) ----
# Generic, public-literature queries only. NanoDx-internal queries (own validation data, investor-deck
# assumptions) and the Research Backlog are deliberately NOT here: this repo and site are public.
- name: TBI biomarker evidence
  workstream: Biomarkers
  category: Research · Biomarkers
  relevance_keywords: [GFAP, S100B, UCH-L1, neurofilament, tau protein, biomarker, blood test]
  pubmed_query: ("traumatic brain injury" OR concussion OR "head injury") AND (GFAP OR S100B OR "UCH-L1") AND (sensitivity OR specificity OR "negative predictive value" OR kinetics OR "diagnostic accuracy")
  nih_query: (GFAP OR S100B OR "UCH-L1") AND ("traumatic brain injury" OR concussion)
  news_queries:
  - (GFAP OR S100B OR "UCH-L1") "brain injury" blood test
- name: Point-of-care & capillary sampling
  workstream: Technology
  category: Research · Technology
  relevance_keywords: [capillary, fingerstick, finger-stick, whole blood, point-of-care, point of care, biosensor, turnaround, rapid]
  pubmed_query: (capillary OR fingerstick OR "finger-stick" OR "whole blood" OR "point-of-care" OR biosensor) AND (GFAP OR S100B OR "UCH-L1" OR "brain injury" OR concussion)
  nih_query: ("point-of-care" OR biosensor OR fingerstick) AND ("traumatic brain injury" OR concussion)
- name: TBI epidemiology & ED burden
  workstream: Market sizing
  category: Research · Market sizing
  relevance_keywords: [emergency department, ED visits, incidence, prevalence, epidemiolog, hospitalization, burden, mild traumatic, cost]
  pubmed_query: ("traumatic brain injury" OR concussion OR "head injury") AND ("emergency department" OR "urgent care") AND (incidence OR epidemiology OR visits OR trends OR "direct costs") AND ("United States" OR national)
  news_queries:
  - CDC "traumatic brain injury" emergency department visits
- name: CT avoidance & health economics
  workstream: Economics
  category: Research · Economics
  relevance_keywords: [computed tomography, CT scan, head CT, ' CT ', CT use, CT rate, cost, economic, utilization, imaging]
  pubmed_query: ("traumatic brain injury" OR "head injury" OR concussion) AND (biomarker OR GFAP OR S100B) AND ("computed tomography" OR CT) AND (cost OR "cost-effectiveness" OR utilization OR "unnecessary")
- name: TBI clinical guidelines
  workstream: Regulatory
  category: Research · Guidelines
  relevance_keywords: [guideline, ACEP, NICE, recommendation, clinical policy, consensus, Scandinavian]
  pubmed_query: ("mild traumatic brain injury" OR concussion OR "head injury") AND (guideline OR "clinical policy" OR consensus) AND (biomarker OR GFAP OR S100B)
  news_queries:
  - (ACEP OR NICE) "head injury" OR "brain injury" guideline blood biomarker
- name: TBI test reimbursement (CPT 0570U)
  workstream: Reimbursement
  category: Research · Reimbursement
