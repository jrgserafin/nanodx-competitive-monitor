# NanoDx Competitive Monitor — what to watch
#
# Edit this file on GitHub (pencil icon) to add/remove competitors. Changes take
# effect on the next run. Every field except `name` is optional.
#
#   name            Display name
#   category        Free-text grouping shown on the dashboard
#   website         Homepage (linked from the dashboard)
#   watch_pages     Pages to scrape for NEW headlines/links (newsroom, press, products)
#                   (if a company has a website but no watch_pages, its homepage is
#                   watched automatically; set watch_homepage: false to turn that off)
#   news_queries    Google News searches (use quotes for exact phrases)
#   rss             Any RSS/Atom feed URLs (investor relations, blogs)
#   fda_applicant   Company name as it appears in FDA 510(k)/PMA records
#   trials_sponsor  Sponsor name on ClinicalTrials.gov
#   pubmed_query    PubMed search for new publications
#   relevance_keywords  For big companies: FDA, trial, website, RSS, patent and job
#                   items are kept only if they mention one of these words (news,
#                   PubMed and SEC are already targeted, so they are not filtered)
#   sec_ticker      US stock ticker -> SEC EDGAR filings (8-K, 10-Q, 10-K, S-1 ...)
#   patent_assignee Company name on US patents (needs PATENTSVIEW_API_KEY secret)
#   jobs            Public job board -> hiring signals, e.g. {greenhouse: companyslug},
#                   {lever: companyslug} or {ashby: companyslug}
#   federal_register_query  Search of CMS/FDA rules & notices (best on a topic)
#   profile         Battlecard notes your team maintains: hq, ticker, products,
#                   pricing, positioning, notes. The AI battlecard reads these.
#
# Source: NanoDx Competitive Intelligence Report, Sept 2026 — 8 direct + 13 indirect companies (Oculogica SNAP and EyeBOX combined).

settings:
  digest_title: "NanoDx Competitive Digest"
  # THIS REPO IS PUBLIC. Keep confidential details out of this file.
  # The AI analyst (ANTHROPIC_API_KEY secret) reads NanoDx's description from the
  # COMPANY_CONTEXT secret (preferred: private) or, if that's missing, from here.
  company_context: >-
    NanoDx develops diagnostics for traumatic brain injury (TBI).
  # false = AI briefs and battlecard strategy (threat level, strengths, weaknesses,
  # talk track) are emailed only and never written to this public repo/site.
  publish_strategy: false
  ai_model: claude-sonnet-4-5   # any current Claude model id
  # Items mentioning these trigger an instant alert email (FDA decisions and
  # material SEC 8-Ks always alert).
  alert_keywords: [FDA clearance, FDA cleared, clears, 510(k), De Novo, PMA, approval, approved, Breakthrough Device, CE mark, CLIA waiver, waived, acquisition, acquire, acquires, merger, recall, launch, launches, reimbursement, CPT code]
  lookback_days: 14          # ignore items published longer ago than this
  send_when_empty: true      # still email a short "no new activity" note
  max_items_per_source: 15
  # Words that mark an item as "high signal" (case-insensitive)
  signal_keywords:
    - FDA
    - 510(k)
    - clearance
    - approval
    - CE mark
    - CLIA
    - waived
    - launch
    - acquisition
    - acquire
    - partnership
    - reimbursement
    - CPT
    - recall
    - whole blood
    - point-of-care
    - GFAP
    - UCH-L1
    - concussion
    - layoffs
    - funding
    - raises

